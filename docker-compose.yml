name: marketplace-bi

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: 8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER}", "--password", "${CLICKHOUSE_PASSWORD}", "-q", "SELECT 1"]
      interval: 5s
      retries: 20

  # Shared metadata storage for Airflow and Superset (separate databases).
  metadata-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  airflow:
    build: ./airflow
    # Standalone keeps the scheduler, api-server, dag-processor and triggerer in one
    # container: the stack has to fit into a laptop's Docker memory limit.
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      <<: *clickhouse-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@metadata-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow/generator
      DBT_PROJECT_DIR: /opt/airflow/dbt
      DBT_PROFILES_DIR: /opt/airflow/dbt
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./generator:/opt/airflow/generator
      - ./dbt:/opt/airflow/dbt
    depends_on:
      clickhouse: { condition: service_healthy }
      metadata-db: { condition: service_healthy }

  superset:
    build: ./superset
    command: /app/docker/init-and-run.sh
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:superset@metadata-db:5432/superset
    ports:
      - "8088:8088"
    depends_on:
      metadata-db: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 10s
      start_period: 60s
      retries: 30

  # One-shot job: creates the ClickHouse connection, datasets, charts and dashboards
  # through the Superset API. Idempotent: safe to re-run after any change in bootstrap/.
  superset-bootstrap:
    build: ./superset
    command: python /app/bootstrap/bootstrap.py
    restart: "no"
    # Needs the marts to exist, so it is run explicitly after the first backfill.
    profiles: [bootstrap]
    environment:
      <<: *clickhouse-env
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:superset@metadata-db:5432/superset
    volumes:
      - ./superset/bootstrap:/app/bootstrap:ro
    depends_on:
      superset: { condition: service_healthy }

volumes:
  clickhouse-data:
  metadata-db-data:
